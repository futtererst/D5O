<style>

(0,1fr));gap:16px;margin:20px 0}.completion article{padding:17px;border:1px solid var(--line);border-radius:6px}.completion small,.completion strong{display:block}.completion strong{font-size:16px;margin:5px 0}.mobile-menu{display:none}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 36px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:7px;box-shadow:0 6px 30px #102b4133;font-size:13px;z-index:20}.toast[hidden]{display:none}dialog{border:0;border-radius:10px;padding:0;max-width:920px;width:calc(100vw - 40px);box-shadow:0 20px 90px #102b4144;color:var(--ink)}dialog::backdrop{background:#102b4166;backdrop-filter:blur(2px)}.dialog-header{display:flex;justify-content:space-between;gap:20px;padding:22px 28px;border-bottom:1px solid var(--line)}.dialog-header h2{font-size:21px}.close{padding:3px 10px;font-size:22px;border:0;align-self:flex-start}.wizard{display:grid;grid-template-columns:215px minmax(0,1fr)}.wizard-steps{padding:24px 20px;background:#f5f9fa;list-style:none;margin:0}.wizard-steps li{padding:13px 5px;color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center}.wizard-steps li.active{color:var(--teal-dark);font-weight:700}.wizard-steps .number{width:24px;height:24px;flex-basis:24px}.wizard-steps .active .number{background:var(--teal);color:white;border-color:var(--teal)}.wizard-body{padding:26px 30px;min-height:420px}.wizard-body>p{font-size:13px;color:var(--muted);margin:8px 0 24px}.wizard-actions{padding:18px 28px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between}.wizard-actions>div{display:flex;gap:10px}.error{color:#aa283b;margin-bottom:12px;font-size:13px}.detail-body{padding:25px 28px;max-height:65vh;overflow:auto}.detail-body p{font-size:13px;margin:10px 0 20px}.detail-body dl{display:grid;grid-template-columns:130px 1fr;font-size:13px;gap:12px}.detail-body dt{color:var(--muted)}.detail-body dd{margin:0;overflow-wrap:anywhere}.callout{background:#f0f7f9;border-left:3px solid var(--teal);padding:12px 16px;font-size:12px;margin:16px 0}.document{display:flex;justify-content:space-between;align-items:center;padding:17px 0;border-bottom:1px solid var(--line);gap:15px}.document strong{font-size:13px}.document small{display:block;font-size:11px}.document button{font-size:12px}.queue-item{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:20px 0;border-bottom:1px solid var(--line)}.queue-item p{color:var(--muted);font-size:12px;margin-top:6px}.queue-item h3{font-size:15px}#screen:focus{outline:none}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(min-width:1101px){.content{padding-top:24px}.panel{padding:21px}.task{padding:10px 12px}.task strong{line-height:1.35}.task small{line-height:1.4}.summary{margin-top:17px}.links{margin-top:17px;padding-top:13px}.tabs{margin-top:12px;margin-bottom:18px}.phase-nav{margin-top:20px}}@media(max-width:1100px){.app{grid-template-columns:175px minmax(0,1fr)}.content{padding:24px}.topbar{padding:0 24px}.phase{padding:14px 8px;gap:6px}.phase .number{width:24px;height:24px;flex-basis:24px}.work-grid{grid-template-columns:minmax(0,1.5fr) minmax(245px,1fr)}.task .owner{display:none}.phase strong{font-size:12px}}@media(max-width:850px){.work-grid{grid-template-columns:1fr}.work-grid>.panel{grid-row:2}.work-grid>.aside{grid-row:1}.aside{grid-template-columns:1fr 1fr}.phase{display:block}.phase .number{margin-bottom:6px}.position{min-width:120px}h1{font-size:25px}.topbar .search{max-width:340px}.topbar button{font-size:12px;padding:11px}.completion{grid-template-columns:1fr}}@media(max-width:620px){.app{display:block}.sidebar{display:none;padding:20px}.sidebar.open{display:flex}.mobile-menu{display:block;padding:7px 10px}.topbar{padding:10px 16px;height:auto;gap:10px}.topbar .search{display:none}.topbar .primary{margin-left:auto}.prototype{padding:7px 16px;font-size:10px}.content{padding:22px 16px}.record-heading{display:block}.position{text-align:left;margin-top:15px}.position .eyebrow{display:inline;margin-right:8px}.position strong{display:inline}.phase-nav{grid-template-columns:repeat(3,minmax(0,1fr))}.phase:nth-child(3){border-right:0}.phase:nth-child(-n+3){border-bottom:1px solid var(--line)}.phase{display:flex;padding:12px 8px}.phase .number{margin:0}.phase-note{line-height:1.6}.tabs{gap:23px}.aside{grid-template-columns:1fr}.panel{padding:19px}.handoff{display:block}.handoff .muted{display:block;margin-top:6px}.wizard{grid-template-columns:1fr}.wizard-steps{display:flex;justify-content:space-between;padding:12px 15px;gap:4px}.wizard-steps li{padding:0;font-size:11px;gap:4px}.wizard-steps li span:last-child{display:none}.wizard-body{padding:22px;min-height:360px}.dialog-header{padding:18px 22px}.wizard-actions{padding:16px;flex-wrap:wrap}.wizard-actions button{font-size:12px;padding:10px}.dialog-header h2{font-size:19px}.detail-body{padding:22px}.detail-body dl{grid-template-columns:1fr;gap:6px}.detail-body dd{margin-bottom:12px}.page-heading{align-items:flex-start}.page-heading button{font-size:12px}.queue-item{align-items:flex-start;flex-direction:column}.summary{font-size:11px}.task{padding:13px 10px}}

<body>
<div class="app"><aside class="sidebar" id="sidebar"><div class="brand">D5<span>O</span></div><div class="workspace">Rybex <small>Delivery workspace</small></div><nav aria-label="Main navigation" id="main-nav"></nav><div class="bottom"><div class="eyebrow">PROTOTYPE ROLE</div><label class="sr-only" for="actor">View as fictional user</label><select id="actor"><option value="alex">Alex Morgan · Project manager</option><option value="jordan">Jordan Lee · Operations reviewer</option><option value="casey">Casey Park · Field lead</option><option value="morgan">Morgan Reed · Finance</option></select><p class="note">Switch roles to try the review handoff. This is a design simulation.</p></div></aside><div class="body"><header class="topbar"><button class="mobile-menu" id="menu" aria-controls="sidebar" aria-expanded="false">Menu</button><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="search" aria-label="Search work" placeholder="Search work, customers, sites…"></div><button class="primary" id="create">+ Create opportunity</button></header><div class="prototype"><span>INTERACTIVE CONCEPT · Fictional data · Changes stay in this browser</span><button id="reset">Reset prototype</button></div><main id="screen" class="content" tabindex="-1"></main></div></div>
<dialog id="wizard-dialog" aria-labelledby="wizard-title"></dialog><dialog id="detail-dialog" aria-labelledby="detail-title"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const KEY='d5o-guided-navigation-v1', DRAFT='d5o-guided-navigation-draft-v1';
const people={alex:'Alex Morgan',jordan:'Jordan Lee',casey:'Casey Park',morgan:'Morgan Reed'};
// Matches WorkPhaseJourney.tsx. Viewing a phase never commits a transition.
const phases=[
{name:'Discover',title:'Understand the opportunity',purpose:'Capture the customer need and agree whether to pursue the work.',tasks:['Customer need recorded','Customer and site identified','Pursuit decision recorded'],owner:'alex'},
{name:'Define',title:'Define the work',purpose:'Confirm scope, requirements and delivery assumptions.',tasks:['Customer requirements confirmed','Site information attached','Delivery requirements recorded','Commercial assumptions captured','Finalise scope of work','Scope approval'],owner:'alex'},
{name:'Develop',title:'Develop the commercial offer',purpose:'Prepare the estimate, review pricing and record the customer outcome.',tasks:['Estimate prepared','Pricing review recorded','Proposal prepared','Customer award recorded'],owner:'alex'},
{name:'Design',title:'Prepare delivery',purpose:'Confirm work packages, qualified people and release readiness.',tasks:['Work packages defined','Qualified crew and capacity confirmed','Verification plan prepared','Delivery release recorded'],owner:'alex'},
{name:'Deploy',title:'Deliver and capture evidence',purpose:'Record completed work, resolve issues and assemble the handover evidence.',tasks:['Work completion evidence recorded','Inspection results recorded','Open issues resolved','Customer handover submitted'],owner:'casey'},
{name:'Operate',title:'Accept and support the work',purpose:'Retain acceptance and plan the ongoing service obligations.',tasks:['Customer acceptance recorded','Support handover confirmed','Service follow-up assigned'],owner:'alex'}
];
const example=()=>({id:'WK-1042',title:'Northline equipment installation',customer:'Northline Manufacturing',site:'Charlotte facility',contact:'Jamie Chen',need:'Install and verify network equipment for the expanded customer site.',type:'Technical delivery',owner:'alex',current:1,done:[3,4,0,0,0,0],values:{'0-0':'Install and verify network equipment.','1-0':'Customer requirements confirmed during the site review.','1-1':'Illustrative site assessment reference.','1-2':'Two controlled work packages; crew qualifications to be confirmed.','1-3':'Estimate and pricing review will occur in Develop.'},pending:null,history:[{text:'Discover completed; Define opened on the same work record.',actor:'Alex Morgan',at:'Example history'},{text:'Opportunity created for Northline Manufacturing.',actor:'Alex Morgan',at:'Example history'}],finance:false});
let storage=true,db;try{db=JSON.parse(localStorage.getItem(KEY));}catch{storage=false;}if(!db||!Array.isArray(db.records)||!db.records.length)db={records:[example()],actor:'alex'};if(!people[db.actor])db.actor='alex';
let view='record',selected=db.records[0].id,phase=0,tab='Overview',query='',filter='All phases',wizardStep=0,wizardData={},toastTimer;
phase=record().current;
try{const link=new URLSearchParams(location.hash.slice(1));if(db.records.some(r=>r.id===link.get('work')))selected=link.get('work');const v=link.get('view');if(['record','work','my','resources','insights','library'].includes(v))view=v;const n=phases.findIndex(p=>p.name===link.get('phase'));phase=n>=0?n:Math.min(record().current,5);if(['Overview','Documents','Decisions','History','Financial closeout'].includes(link.get('tab')))tab=link.get('tab');query=link.get('q')||'';if(['All phases',...phases.map(p=>p.name),'Accepted'].includes(link.get('filter')))filter=link.get('filter');}catch{}
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={work:'<rect x="3" y="6" width="18" height="15" rx="2"/><path d="M8 6V3h8v3M3 11h18"/>',inbox:'<path d="m4 4-2 11v5h20v-5L20 4Z M2 15h6l2 3h4l2-3h6"/>',people:'<circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6m2 5a5 5 0 0 1 3 4v2"/>',chart:'<path d="M4 21V12h4v9M10 21V7h4v14M16 21V3h4v18"/>',book:'<path d="M12 5v16M12 5C9 2 5 2 2 3v16c4-1 7 0 10 2 3-2 6-3 10-2V3c-3-1-7-1-10 2Z"/>'};
const icon=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">${icons[k]}</svg>`;
function record(){return db.records.find(r=>r.id===selected)||db.records[0];}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch{storage=false;notice('Browser storage is unavailable. Changes will last only until this page closes.');}}
function log(r,text){r.history.unshift({text,actor:people[db.actor],at:new Date().toLocaleString()});}
function notice(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,5000);}
function nav(name){view=name;$('#sidebar').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');render();$('#screen').focus();}
function openRecord(id,p){selected=id;phase=p??record().current;tab='Overview';nav('record');}
function count(r,p){return r.done[p]||0;}
function phaseState(r,i){return i<r.current?'Complete':i===r.current?(r.pending?'Awaiting review':'In progress'):'Upcoming';}
function ownerFor(p,t){return p===1&&t===5?'jordan':phases[p].owner;}
function canTask(r,p,t){return p===r.current&&!r.pending&&t===count(r,p)&&ownerFor(p,t)===db.actor&&!(p===1&&t===5);}
function nextTask(r){const p=r.current;if(p>5)return null;return {p,t:count(r,p),label:phases[p].tasks[count(r,p)]};}
function rememberView(){const link=new URLSearchParams({view,work:selected,phase:phases[phase].name,tab,q:query,filter});try{history.replaceState(null,'','#'+link);}catch{}}
function render(){
rememberView();$('#search').value=query;
$('#actor').value=db.actor;
$('#main-nav').innerHTML=[['my','My Work','inbox'],['work','Work','work'],['resources','Resources','people'],['insights','Insights','chart'],['library','Library','book']].map(([v,n,i])=>`<button class="nav-button ${(view===v||(v==='work'&&view==='record'))?'active':''}" data-nav="${v}" ${view===v?'aria-current="page"':''}>${icon(i)}${n}</button>`).join('');
if(view==='record')renderRecord();else if(view==='work')renderWork();else if(view==='my')renderQueue();else if(view==='library')renderLibrary();else if(view==='resources')renderResources();else renderInsights();
}
function renderRecord(){const r=record(),p=phases[phase],n=count(r,phase),pending=r.pending&&r.pending.phase===phase,current=phase===r.current,owner=p.owner,all=n===p.tasks.length, scopeReady=phase===1&&n===5;
$('#screen').innerHTML=`<div class="crumb"><button class="link" data-nav="work">Work</button><span>/</span><span>${esc(r.id)}</span></div><div class="record-heading"><div><h1>${esc(r.title)}</h1><p class="meta">${esc(r.id)} &nbsp;·&nbsp; ${esc(r.customer)} &nbsp;·&nbsp; ${esc(r.site)}<br>Owner: ${people[r.owner]}</p></div><div class="position"><span class="eyebrow">CURRENT POSITION</span><strong>${r.current>5?'Work accepted':phases[r.current].name}</strong>${r.current>5?'<span class="badge">Delivery accepted</span>':''}</div></div><nav class="phase-nav" aria-label="Work phases">${phases.map((p,i)=>`<button class="phase ${i===phase?'selected':''} ${i===r.current?'current':''} ${i<r.current?'done':''}" data-phase="${i}" ${i===phase?'aria-current="page"':''}><span class="number">${i<r.current?'✓':i+1}</span><span><strong>${p.name}</strong><small>${phaseState(r,i)}</small></span></button>`).join('')}</nav><p class="phase-note">Viewing: ${p.name}. Selecting a phase opens its information; it does not advance the work.</p><nav class="tabs" aria-label="Record views">${['Overview','Documents','Decisions','History','Financial closeout'].map(t=>`<button data-tab="${t}" class="${tab===t?'selected':''}" ${tab===t?'aria-current="page"':''}>${t}</button>`).join('')}</nav><div id="record-content"></div>`;
if(tab==='Documents'){renderDocs(r);return;}if(tab==='History'){renderHistory(r);return;}if(tab==='Decisions'){renderDecisions(r);return;}if(tab==='Financial closeout'){renderFinance(r);return;}
let nextHeading='',nextText='',action='',disabled=false;
if(phase<r.current){nextHeading='This phase is complete';nextText='Review the retained information or continue to the current work.';action=`<button class="primary" data-current>Open ${r.current>5?'completion summary':phases[r.current].name}</button>`;}
else if(!current){nextHeading='Preview the upcoming work';nextText=`${phases[r.current]?.name||'The current work'} must complete its required decision first. You can inspect upcoming requirements now.`;action='<button class="primary" data-current>Return to current work</button>';}
else if(pending){nextHeading='Review requested';nextText=`${people[r.pending.by]} submitted revision ${r.pending.revision}. Jordan Lee owns the next decision.`;action=db.actor==='jordan'?'<button class="primary" data-review>Review submission</button>':'<button class="primary" data-nav="my">Open My Work</button>';}
else if(all||scopeReady){nextHeading=scopeReady?'Request scope approval':'Request phase review';nextText='Submit this saved revision to Jordan Lee. Progression happens only after a separate review.';action='<button class="primary" data-submit>Submit for review</button>';disabled=db.actor!==owner;}
else{nextHeading=p.tasks[n];nextText=db.actor===owner?'Complete the current requirement. Information saved earlier stays with this work record.':`${people[owner]} owns this requirement. Switch the prototype role to try their task.`;action=`<button class="primary" data-task="${n}" ${db.actor!==owner?'disabled':''}>${phase===1&&n===4?'Complete scope':'Open task'}</button>`;}
$('#record-content').innerHTML=`<div class="work-grid"><section class="panel"><h2>${p.title}</h2><p>${p.purpose}</p><div class="summary"><strong>${n} of ${p.tasks.length} required activities complete</strong><div class="bar" aria-hidden="true"><span style="width:${n/p.tasks.length*100}%"></span></div></div><div class="task-list">${p.tasks.map((t,i)=>`<button class="task ${i<n?'complete':''}" data-task="${i}"><span class="check" aria-hidden="true">${i<n?'✓':''}</span><span class="task-title"><strong>${t}</strong><small class="${i===n&&current&&!pending?'status':''}">${i<n?'Saved on this work record':pending&&current?'Awaiting review':i===n&&current?(i===5&&phase===1?'Waiting for submission':'Action required'):'Not yet due'}</small></span><span class="owner">${people[ownerFor(phase,i)]}</span></button>`).join('')}</div><div class="links"><h3>Related information</h3><div><button class="link" data-info="customer">Customer & site</button><button class="link" data-info="packages">Work packages</button><button class="link" data-tab="Financial closeout">Financial closeout</button></div></div></section><aside class="aside"><section class="panel next"><div class="eyebrow">${pending?'NEXT HANDOFF':'YOUR NEXT ACTION'}</div><h2>${nextHeading}</h2><p>${nextText}</p>${disabled?action.replace('data-submit','data-submit disabled'):action}<div class="assigned">Assigned to ${pending?'Jordan Lee':people[owner]}</div></section><section class="panel readiness"><h3>Phase readiness</h3><strong style="font-size:13px;color:${phase<r.current?'var(--green)':'var(--amber)'}">${phase<r.current?'Requirements completed':pending?'Review pending':`${p.tasks.length-n} requirements remaining`}</strong><ul>${p.tasks.slice(n).map(t=>`<li>${t}</li>`).join('')||'<li>Review retained decisions and saved information.</li>'}</ul>${current&&!pending?`<button data-submit ${!((all||scopeReady)&&db.actor===owner)?'disabled':''}>Submit for review</button>`:''}</section></aside></div><div class="handoff"><span><strong>Next handoff:</strong> ${pending?'Jordan Lee · review the submitted revision':current?'Jordan Lee · review after required inputs are saved':phase<r.current?'Recorded in Decisions':'Available when earlier requirements are complete'}</span><span class="muted">One work record · ${esc(r.id)}</span></div>`;
}
function renderWork(){rememberView();const records=db.records.filter(r=>`${r.title} ${r.customer} ${r.site} ${r.id}`.toLowerCase().includes(query.toLowerCase())&&(filter==='All phases'||(r.current>5?'Accepted':phases[r.current].name)===filter));let draft=false;try{draft=!!localStorage.getItem(DRAFT);}catch{}$('#screen').innerHTML=`<div class="page-heading"><div><div class="eyebrow">RYBEX WORKSPACE</div><h1>Work</h1><p>Find the work, see its current position, and continue where you left off.</p></div></div>${draft?'<div class="callout">You have a saved opportunity draft. <button class="link" data-create>Resume draft</button></div>':''}<div class="filters"><label class="sr-only" for="phase-filter">Filter work by phase</label><select id="phase-filter">${['All phases',...phases.map(p=>p.name),'Accepted'].map(p=>`<option ${p===filter?'selected':''}>${p}</option>`).join('')}</select><span>${records.length} record${records.length===1?'':'s'} · Search and filters stay in place when you return.</span></div><div class="panel table-wrap"><table><thead><tr><th>WORK RECORD</th><th>CUSTOMER / SITE</th><th>CURRENT POSITION</th><th>NEXT ACTION</th><th></th></tr></thead><tbody>${records.map(r=>`<tr><td><strong>${esc(r.title)}</strong><br><small>${r.id}</small></td><td>${esc(r.customer)}<br><small>${esc(r.site)}</small></td><td>${r.current>5?'Accepted':phases[r.current].name}</td><td>${r.pending?'Jordan Lee: review submission':r.current>5?(r.finance?'Support follow-up':'Finance closeout'):esc(nextTask(r).label||'Submit phase for review')}</td><td><button data-open="${r.id}">Open work</button></td></tr>`).join('')}</tbody></table>${!records.length?'<div class="empty">No work matches these filters.</div>':''}</div>`;}
function renderQueue(){const items=[];for(const r of db.records){if(r.pending&&db.actor==='jordan')items.push({r,title:`Review ${phases[r.pending.phase].name} submission`,text:`Revision ${r.pending.revision} · Submitted by ${people[r.pending.by]}`,action:'review'});else if(r.current<=5&&!r.pending&&phases[r.current].owner===db.actor)items.push({r,title:nextTask(r).label||'Submit phase for review',text:`${phases[r.current].name} · Your assigned work`,action:'task'});if(r.current>5&&!r.finance&&db.actor==='morgan')items.push({r,title:'Review financial closeout',text:'Delivery accepted · Billing disposition remains separate',action:'finance'});}$('#screen').innerHTML=`<div class="page-heading"><div><div class="eyebrow">${people[db.actor].toUpperCase()}</div><h1>My Work</h1><p>Your next actions, with direct access to the right record and activity.</p></div></div><div class="panel">${items.length?items.map(({r,title,text,action})=>`<article class="queue-item"><div><h3>${title}</h3><p>${esc(r.title)} · ${r.id}</p><p>${text}</p></div><button class="primary" data-queue="${r.id}" data-action="${action}">Open action</button></article>`).join(''):'<div class="empty">No action is assigned to this prototype role. Try Alex Morgan to complete scope, then Jordan Lee to review the submission.</div>'}</div>`;}
function renderDocs(r){const entries=Object.entries(r.values);$('#record-content').innerHTML=`<section class="panel"><h2>Saved work information</h2><p>Illustrative notes linked to the same work record. No files are uploaded by this prototype.</p>${entries.map(([key,value])=>{const [p,t]=key.split('-').map(Number);return `<article class="document"><div><strong>${phases[p].tasks[t]}</strong><small>${phases[p].name} · ${esc(String(value).slice(0,95))}</small></div><button data-doc="${key}">View</button></article>`;}).join('')||'<div class="empty">No notes saved yet.</div>'}</section>`;}
function renderHistory(r){$('#record-content').innerHTML=`<section class="panel"><h2>Work history</h2><p>Prototype interactions retained against ${r.id}.</p><ul class="timeline">${r.history.map(h=>`<li>${esc(h.text)}<small>${esc(h.actor)} · ${esc(h.at)}</small></li>`).join('')}</ul></section>`;}
function renderDecisions(r){$('#record-content').innerHTML=`<section class="panel"><h2>Decisions & handoffs</h2><p>View the submitted revision, receiving owner, and retained review history.</p>${r.pending?`<article class="queue-item"><div><h3>${phases[r.pending.phase].name} · Review requested</h3><p>Revision ${r.pending.revision} · ${people[r.pending.by]} → Jordan Lee</p><p>Current position remains ${phases[r.current].name} until the decision is recorded.</p></div><button class="primary" data-review ${db.actor!=='jordan'?'disabled':''}>Review submission</button></article>${db.actor!=='jordan'?'<p class="callout">Jordan Lee owns this review. Switch the prototype role to open the decision.</p>':''}`:'<div class="callout">No decision is waiting. The next review appears after the phase requirements are submitted.</div>'}<ul class="timeline">${r.history.filter(h=>/review|approved|returned/i.test(h.text)).map(h=>`<li>${esc(h.text)}<small>${esc(h.actor)} · ${esc(h.at)}</small></li>`).join('')}</ul></section>`;}
function renderFinance(r){$('#record-content').innerHTML=`<section class="panel"><h2>Completion & financial closeout</h2><p>Delivery acceptance and financial disposition are tracked separately.</p><div class="completion"><article><small>Delivery evidence</small><strong>${r.current>4?'Submitted':'Not yet submitted'}</strong><small>Deploy activities</small></article><article><small>Customer acceptance</small><strong>${r.current>5?'Recorded':'Not yet recorded'}</strong><small>Operate review</small></article><article><small>Financial closeout</small><strong>${r.finance?'Reviewed':'Open'}</strong><small>${r.finance?'Prototype disposition: ready for billing review':'Assigned to Morgan Reed'}</small></article></div><p class="callout">This prototype records a simulated closeout review. It does not create an invoice or record payment.</p><button class="primary" data-finance ${r.current<=5||r.finance||db.actor!=='morgan'?'disabled':''}>Record financial closeout review</button>${db.actor!=='morgan'?'<p>Switch to Morgan Reed to try Finance’s action once customer acceptance is recorded.</p>':''}</section>`;}
function renderLibrary(){$('#screen').innerHTML='<div class="page-heading"><div><h1>Library</h1><p>Saved information remains attached to its originating work.</p></div></div><div class="panel">'+db.records.map(r=>`<article class="document"><div><strong>${esc(r.title)}</strong><small>${Object.keys(r.values).length} saved notes · ${r.id}</small></div><button data-library="${r.id}">Open documents</button></article>`).join('')+'</div>';}
function renderResources(){$('#screen').innerHTML='<div class="page-heading"><div><h1>Resources</h1><p>People and responsibility in this illustrative journey.</p></div></div><section class="panel"><table><thead><tr><th>PERSON</th><th>RESPONSIBILITY</th></tr></thead><tbody>'+[['alex','Opportunity, scope and delivery preparation'],['jordan','Independent phase review and receiving decisions'],['casey','Field delivery and evidence'],['morgan','Financial closeout review']].map(([id,task])=>`<tr><td>${people[id]}</td><td>${task}</td></tr>`).join('')+'</tbody></table><p class="callout">These are fictional role examples. Production permissions and qualification checks remain governed by the existing application.</p></section>';}
function renderInsights(){$('#screen').innerHTML='<div class="page-heading"><div><h1>Insights</h1><p>Current state of the fictional records in this browser.</p></div></div><section class="panel"><table><thead><tr><th>MEASURE</th><th>RECORDS</th></tr></thead><tbody>'+[['Work records',db.records.length],['Waiting for review',db.records.filter(r=>r.pending).length],['Delivery accepted',db.records.filter(r=>r.current>5).length],['Financial closeout reviewed',db.records.filter(r=>r.finance).length]].map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')+'</tbody></table></section>';}
function detail(title,body,footer=''){const d=$('#detail-dialog');d.innerHTML=`<header class="dialog-header"><h2 id="detail-title">${title}</h2><button class="close" data-close="detail-dialog" aria-label="Close dialog">×</button></header><div class="detail-body">${body}</div>${footer?`<footer class="wizard-actions">${footer}</footer>`:''}`;d.showModal();}
function openTask(t){const r=record(),p=phase,key=`${p}-${t}`,done=t<count(r,p);if(p===1&&t===5){tab='Decisions';render();return;}const editable=canTask(r,p,t);detail(phases[p].tasks[t],`<p>${done?'Review the information already saved on this record.':editable?'Save the information needed for this activity. This simulated activity does not perform a production decision.':'This activity is available when its prerequisites are complete and its assigned role opens it.'}</p><p><strong>${r.id} · ${phases[p].name}</strong><br>Assigned to ${people[ownerFor(p,t)]}</p><form id="task-form"><label for="task-note">${p===1&&t===4?'Scope of work':'Activity note'}<textarea id="task-note" name="note" required ${!editable?'readonly':''} placeholder="Record the required details…">${esc(r.values[key]||'')}</textarea></label><div id="task-error" class="error" role="alert"></div></form>`,editable?`<span class="muted" style="font-size:12px">Saved to ${r.id}</span><button class="primary" form="task-form">Save activity</button>`:'<button data-close="detail-dialog">Close</button>');const form=$('#task-form');form.addEventListener('submit',e=>{e.preventDefault();const note=form.note.value.trim();if(!note){$('#task-error').textContent='Enter a note before saving.';return;}if(!canTask(r,p,t))return;r.values[key]=note;r.done[p]=t+1;log(r,`${phases[p].name}: ${phases[p].tasks[t]} saved.`);save();$('#detail-dialog').close();render();notice('Activity saved. The next requirement is ready.');});}
function submitReview(){const r=record(),p=r.current;if(p>5||phase!==p||r.pending||db.actor!==phases[p].owner)return;const n=count(r,p);if(!(n===phases[p].tasks.length||(p===1&&n===5)))return;const revision=r.history.filter(h=>h.text.startsWith(`${phases[p].name} submitted`)).length+1;r.pending={phase:p,by:db.actor,revision};log(r,`${phases[p].name} submitted for review, revision ${revision}; assigned to Jordan Lee.`);save();render();notice('Review requested. Switch to Jordan Lee and open My Work.');}
function openReview(){const r=record();if(!r.pending||db.actor!=='jordan')return;const snapshot={...r.pending},p=snapshot.phase;detail(`Review ${phases[p].name} submission`,`<div class="callout">${r.id} · Revision ${snapshot.revision} · Submitted by ${people[snapshot.by]}</div><p>Review the saved activity notes and record the basis for your decision. Approval advances only this simulated record.</p>${Object.entries(r.values).filter(([key])=>key.startsWith(p+'-')).map(([key,v])=>`<p><strong>${phases[p].tasks[Number(key.split('-')[1])]}</strong><br>${esc(v)}</p>`).join('')}<label for="review-note">Decision basis<textarea id="review-note" placeholder="Explain the approval or the correction needed…"></textarea></label><div id="review-error" class="error" role="alert"></div>`,`<button data-decision="return">Return for correction</button><button class="primary" data-decision="approve">Approve ${p===5?'acceptance':`and open ${phases[p+1].name}`}</button>`);$('#detail-dialog').querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>{const note=$('#review-note').value.trim();if(!note){$('#review-error').textContent='Record a decision basis before continuing.';return;}if(!r.pending||r.pending.revision!==snapshot.revision||r.pending.phase!==p||db.actor!=='jordan')return;const approve=b.dataset.decision==='approve';if(approve){r.done[p]=phases[p].tasks.length;r.current=p+1;phase=Math.min(p+1,5);log(r,`${phases[p].name} review revision ${snapshot.revision} approved: ${note}`);}else{r.done[p]=p===1?4:Math.max(0,phases[p].tasks.length-1);log(r,`${phases[p].name} review revision ${snapshot.revision} returned: ${note}`);}r.pending=null;save();$('#detail-dialog').close();render();notice(approve?'Review recorded. The same work record continues.':'Returned to its owner for correction. Earlier review history is retained.');});}
const wizardTitles=['Customer & location','Customer need','Initial context','Review & create'];
function openWizard(){try{const draft=JSON.parse(localStorage.getItem(DRAFT));wizardData=draft?.data||{};wizardStep=draft?.step||0;}catch{wizardData={};wizardStep=0;}renderWizard();$('#wizard-dialog').showModal();}
function collectWizard(){const form=$('#wizard-form');if(form)for(const [k,v]of new FormData(form))wizardData[k]=v;}
function persistDraft(){collectWizard();try{localStorage.setItem(DRAFT,JSON.stringify({step:wizardStep,data:wizardData}));return true;}catch{notice('Draft could not be saved because browser storage is unavailable.');return false;}}
function renderWizard(error=''){const w=wizardData;let body='';if(wizardStep===0)body=`<label>Customer<input name="customer" required value="${esc(w.customer)}" placeholder="Customer name"></label><label>Site<input name="site" value="${esc(w.site)}" placeholder="Site or location, if known"></label><label>Primary contact<input name="contact" value="${esc(w.contact)}" placeholder="Contact name, if known"></label>`;if(wizardStep===1)body=`<label>Opportunity name<input name="title" required value="${esc(w.title)}" placeholder="A clear, recognisable work title"></label><label>Customer need<textarea name="need" required placeholder="What problem or outcome is the customer asking you to address?">${esc(w.need)}</textarea></label>`;if(wizardStep===2)body=`<label>Work type<select name="type">${['Technical delivery','Retrofit','Lifecycle service'].map(t=>`<option ${w.type===t?'selected':''}>${t}</option>`).join('')}</select></label><label>Requested timing<input name="timing" value="${esc(w.timing)}" placeholder="If known, for example Q1 2027"></label><label>Opportunity owner<select name="owner"><option value="alex">Alex Morgan · Project manager</option></select></label><p class="callout">Detailed scope, pricing and delivery information are collected in their relevant phases.</p>`;if(wizardStep===3)body=`<dl>${[['Customer',w.customer],['Site',w.site||'Not yet known'],['Contact',w.contact||'Not yet known'],['Opportunity',w.title],['Customer need',w.need],['Work type',w.type],['Timing',w.timing||'Not yet known'],['Owner','Alex Morgan']].map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl><div class="callout">Create opens a new record in Discover. It does not qualify the pursuit or approve work.</div>`;$('#wizard-dialog').innerHTML=`<header class="dialog-header"><div><div class="eyebrow">NEW OPPORTUNITY · STEP ${wizardStep+1} OF 4</div><h2 id="wizard-title">Create opportunity</h2></div><button class="close" data-close="wizard-dialog" aria-label="Close and retain draft">×</button></header><div class="wizard"><ol class="wizard-steps">${wizardTitles.map((t,i)=>`<li class="${i===wizardStep?'active':''}" ${i===wizardStep?'aria-current="step"':''}><span class="number">${i<wizardStep?'✓':i+1}</span><span>${t}</span></li>`).join('')}</ol><div class="wizard-body detail-body"><h2>${wizardTitles[wizardStep]}</h2><p>${wizardStep===3?'Check the basics before opening your work record.':'Start with what you know. You can save a draft and return later.'}</p><div class="error" role="alert">${esc(error)}</div><form id="wizard-form">${body}</form></div></div><footer class="wizard-actions"><button data-draft>Save draft & close</button><div>${wizardStep?'<button data-wizard-back>Back</button>':''}<button class="primary" form="wizard-form">${wizardStep===3?'Create opportunity':'Continue'}</button></div></footer>`;$('#wizard-form').onsubmit=e=>{e.preventDefault();collectWizard();if(wizardStep===0&&!String(wizardData.customer||'').trim()){renderWizard('Enter the customer name.');return;}if(wizardStep===1&&(!String(wizardData.title||'').trim()||!String(wizardData.need||'').trim())){renderWizard('Enter an opportunity name and customer need.');return;}if(wizardStep<3){wizardStep++;persistDraft();renderWizard();$('#wizard-title').focus();}else{const id='WK-'+(1043+db.records.length-1);const r={...example(),id,title:w.title.trim(),customer:w.customer.trim(),site:(w.site||'Site to be confirmed').trim(),contact:w.contact||'',need:w.need.trim(),type:w.type||'Technical delivery',timing:w.timing||'',owner:'alex',current:0,done:[0,0,0,0,0,0],values:{},pending:null,finance:false,history:[]};log(r,'Opportunity created. Discover requirements are ready.');db.records.unshift(r);db.actor='alex';save();try{localStorage.removeItem(DRAFT);}catch{}$('#wizard-dialog').close();openRecord(id,0);notice('Opportunity created. Continue in Discover on this work record.');}};}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.nav){nav(d.nav);return;}if(d.open){openRecord(d.open);return;}if(d.phase!==undefined){phase=Number(d.phase);render();return;}if(d.tab){tab=d.tab;render();return;}if(d.task!==undefined){openTask(Number(d.task));return;}if('current'in d){phase=Math.min(record().current,5);tab=record().current>5?'Financial closeout':'Overview';render();return;}if('submit'in d){submitReview();return;}if('review'in d){openReview();return;}if('create'in d){openWizard();return;}if(d.queue){selected=d.queue;phase=Math.min(record().current,5);view='record';tab=d.action==='finance'?'Financial closeout':'Overview';render();if(d.action==='review')openReview();else if(d.action==='task'&&nextTask(record()).label)openTask(count(record(),phase));return;}if(d.close){if(d.close==='wizard-dialog'&&!persistDraft())return;$('#'+d.close).close();if(d.close==='wizard-dialog')render();return;}if('draft'in d){if(persistDraft()){$('#wizard-dialog').close();render();notice('Draft saved. Use Create opportunity to resume.');}return;}if('wizardBack'in d){collectWizard();wizardStep--;renderWizard();return;}if(d.library){openRecord(d.library);tab='Documents';render();return;}if(d.doc){const r=record(),[p,t]=d.doc.split('-').map(Number);detail(phases[p].tasks[t],`<p>${esc(r.values[d.doc])}</p><p class="muted">${r.id} · ${phases[p].name}</p>`);return;}if(d.info){const r=record();if(d.info==='customer')detail('Customer & site',`<dl><dt>Customer</dt><dd>${esc(r.customer)}</dd><dt>Site</dt><dd>${esc(r.site)}</dd><dt>Contact</dt><dd>${esc(r.contact||'Not yet known')}</dd><dt>Customer need</dt><dd>${esc(r.need)}</dd></dl>`);else detail('Work packages',`<p>Delivery preparation belongs to Design. This prototype shows the navigation link without fabricating released packages.</p><div class="callout">${r.current>3?'Design review completed in this simulation.':'Work packages are not released by opening this view.'}</div>`);return;}if('finance'in d){const r=record();if(db.actor==='morgan'&&r.current>5&&!r.finance){r.finance=true;log(r,'Financial closeout reviewed. Simulated disposition: ready for billing review. No invoice created.');save();render();notice('Financial review recorded separately from customer acceptance.');}}});
$('#create').onclick=openWizard;$('#actor').onchange=e=>{db.actor=e.target.value;save();render();notice(`Viewing as ${people[db.actor]}.`);};$('#search').oninput=e=>{query=e.target.value;view='work';render();};document.addEventListener('change',e=>{if(e.target.id==='phase-filter'){filter=e.target.value;renderWork();}});$('#menu').onclick=()=>{const open=$('#sidebar').classList.toggle('open');$('#menu').setAttribute('aria-expanded',String(open));};$('#reset').onclick=()=>{detail('Reset the fictional workspace?','<p>This removes only this prototype’s saved records and opportunity draft from this browser.</p>','<button data-close="detail-dialog">Cancel</button><button class="primary" id="confirm-reset">Reset prototype</button>');$('#confirm-reset').onclick=()=>{db={records:[example()],actor:'alex'};selected='WK-1042';phase=1;tab='Overview';query='';filter='All phases';view='record';$('#search').value='';save();try{localStorage.removeItem(DRAFT);}catch{}$('#detail-dialog').close();render();notice('Prototype reset to the fictional starting record.');};};$('#wizard-dialog').addEventListener('cancel',e=>{if(!persistDraft())e.preventDefault();else render();});render();if(!storage)notice('Browser storage is unavailable. Changes last only while this page stays open.');
</script></body></html>
